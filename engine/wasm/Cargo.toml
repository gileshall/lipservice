[package]
name = "lipservice-wasm"
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0-only"
description = "The lipservice engine for the browser, as a C ABI over wasm32 memory"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
lipservice = { path = ".." }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
