# Builds the engine and the wheel on each system and loads the engine through the package.
# Speech and song are not made here: the models are fetched on first use, and this job fetches
# nothing.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The engine's unit tests
        run: cargo test --release --lib --locked
        working-directory: engine
      - name: The engine's command line
        run: cargo build --release --locked
        working-directory: engine
      - name: The wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install it
        run: python -m pip install --no-index --find-links dist lipservice
      - name: Load the engine and list the voices
        run: |
          python -c "from lipservice import _engine; _engine._library(); print('engine loaded')"
          lipservice voices
        working-directory: dist
